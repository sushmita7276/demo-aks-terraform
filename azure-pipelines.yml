
trigger:
  - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Plan
    displayName: Terraform Plan
    jobs:
      - job: TerraformPlan
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '1.13.3'

          - task: AzureCLI@2
            displayName: Terraform Init and Plan
            inputs:
              azureSubscription: 'demo-aks-service-connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                cd terraform
                export ARM_USE_AZUREAD=true
                terraform init
                terraform validate
                terraform plan -out=tfplan
          - publish: '$(Build.SourcesDirectory)/terraform/tfplan'
            artifact: tfplan
            displayName: Publish Terraform Plan

  - stage: Apply
    displayName: Terraform Apply
    dependsOn: Plan
    condition: succeeded()
    jobs:
      - job: TerraformApply
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: '1.13.3'

          - download: current
            artifact: tfplan

          - task: AzureCLI@2
            displayName: Terraform Init and Apply
            inputs:
              azureSubscription: 'demo-aks-service-connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                cd terraform
                export ARM_USE_AZUREAD=true
                terraform init
                terraform apply -auto-approve "$(Pipeline.Workspace)/tfplan/tfplan"